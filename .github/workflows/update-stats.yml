name: Update GitHub profile statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate overview card
        uses: h1s97x/gh-readme-card@main
        with:
          card: user
          params: 'username=LazyYeou&show_icons=true&theme=tokyonight&hide_border=true&hide_rank=true&card_width=380'
          path: profile/stats.svg

      - name: Generate languages card
        uses: h1s97x/gh-readme-card@main
        with:
          card: langs
          params: 'username=LazyYeou&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&card_width=320'
          path: profile/languages.svg

      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile statistics'
            git push
          fi
