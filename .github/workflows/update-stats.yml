name: Update GitHub profile statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout stats generator
        uses: actions/checkout@v4
        with:
          repository: h1s97x/gh-readme-card
          path: .stats-generator
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .stats-generator/package-lock.json

      - name: Install generator dependencies
        working-directory: .stats-generator
        run: npm ci --ignore-scripts

      - name: Generate overview card
        working-directory: .stats-generator
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
          GH_CARD_CARD: user
          GH_CARD_PARAMS: 'username=LazyYeou&show_icons=true&theme=tokyonight&hide_border=true&hide_rank=true&card_width=380'
          GH_CARD_PATH: ${{ github.workspace }}/profile/stats.svg
        run: node src/cli.ts

      - name: Generate languages card
        working-directory: .stats-generator
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
          GH_CARD_CARD: langs
          GH_CARD_PARAMS: 'username=LazyYeou&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&card_width=320'
          GH_CARD_PATH: ${{ github.workspace }}/profile/languages.svg
        run: node src/cli.ts

      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile statistics'
            git push
          fi
