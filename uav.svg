<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="Animated UAV quadcopter patrolling over a waypoint path">
  <style>
    .m { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 11px; }
    .dim { fill: #64748B; }
    .acc { fill: #38BDF8; }
    .grn { fill: #4ADE80; }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111C2E"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="1" y="1" width="718" height="238" rx="12" fill="url(#sky)" stroke="#30363D"/>

  <!-- Twinkling stars -->
  <g fill="#E5E7EB">
    <circle cx="70" cy="34" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="22" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="26" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="44" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="20" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Drifting clouds -->
  <g fill="#1E293B" opacity="0.8">
    <ellipse cx="0" cy="60" rx="60" ry="9">
      <animate attributeName="cx" values="-80;800" dur="40s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="90" rx="40" ry="6">
      <animate attributeName="cx" values="-60;780" dur="28s" begin="-12s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Ground + grid -->
  <line x1="1" y1="200" x2="719" y2="200" stroke="#30363D"/>
  <g stroke="#1F2937" stroke-width="1">
    <line x1="60" y1="200" x2="20" y2="239"/><line x1="180" y1="200" x2="160" y2="239"/>
    <line x1="300" y1="200" x2="290" y2="239"/><line x1="420" y1="200" x2="420" y2="239"/>
    <line x1="540" y1="200" x2="550" y2="239"/><line x1="660" y1="200" x2="680" y2="239"/>
    <line x1="1" y1="214" x2="719" y2="214"/><line x1="1" y1="228" x2="719" y2="228"/>
  </g>

  <!-- Waypoints + dashed flight path -->
  <path d="M80 100 C 220 60, 300 140, 360 100 S 560 60, 640 100" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="2s" repeatCount="indefinite"/>
  </path>
  <g fill="none" stroke="#38BDF8" stroke-width="1.2">
    <circle cx="80" cy="100" r="5"/><circle cx="360" cy="100" r="5"/><circle cx="640" cy="100" r="5"/>
  </g>
  <text x="68" y="190" class="m dim">WP1</text>
  <text x="348" y="190" class="m dim">WP2</text>
  <text x="628" y="190" class="m dim">WP3</text>

  <!-- UAV: flies along the path, back and forth -->
  <g>
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear"
      path="M80 100 C 220 60, 300 140, 360 100 S 560 60, 640 100 S 560 60, 360 100 S 220 140, 80 100"/>

    <!-- Scan beam -->
    <polygon points="-6,14 6,14 46,100 -46,100" fill="url(#beam)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </polygon>

    <!-- Subtle bob + tilt -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-2;0,2;0,-2" dur="1.2s" repeatCount="indefinite"/>

      <!-- Arms -->
      <line x1="-30" y1="-6" x2="-12" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="-6" x2="12" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <!-- Motor posts -->
      <rect x="-34" y="-12" width="8" height="8" rx="2" fill="#475569"/>
      <rect x="26" y="-12" width="8" height="8" rx="2" fill="#475569"/>

      <!-- Spinning rotors (blur effect via rapidly changing width) -->
      <ellipse cx="-30" cy="-15" rx="24" ry="2.2" fill="#E5E7EB" opacity="0.8">
        <animate attributeName="rx" values="24;5;24" dur="0.18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="30" cy="-15" rx="24" ry="2.2" fill="#E5E7EB" opacity="0.8">
        <animate attributeName="rx" values="5;24;5" dur="0.18s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Body -->
      <rect x="-14" y="-8" width="28" height="14" rx="5" fill="#1F2937" stroke="#38BDF8" stroke-width="1.2"/>
      <rect x="-6" y="-4" width="12" height="3" rx="1.5" fill="#38BDF8" opacity="0.7"/>

      <!-- Camera gimbal -->
      <circle cx="0" cy="9" r="4" fill="#0D1117" stroke="#94A3B8" stroke-width="1.2"/>
      <circle cx="0" cy="9" r="1.4" fill="#38BDF8"/>

      <!-- Landing legs -->
      <path d="M-12 6 L-18 16 M12 6 L18 16 M-22 16 H-14 M14 16 H22" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" fill="none"/>

      <!-- Nav LEDs -->
      <circle cx="-34" cy="-8" r="2" fill="#F87171">
        <animate attributeName="opacity" values="1;0.1;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="34" cy="-8" r="2" fill="#4ADE80">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- HUD -->
  <g class="m">
    <text x="18" y="24" class="acc">UAV-01 · PATROL</text>
    <text x="18" y="40" class="dim">ROS 2 · OpenCV · onboard vision</text>
    <circle cx="640" cy="20" r="3.5" fill="#F87171">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="650" y="24" class="grn">REC</text>
  </g>
</svg>
